<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F4A1E">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'sha256-TsQ/jMcGE0Crm6gttLR/maPulWiEJcp6QtkFfRYWOEE='; style-src-attr 'none'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>V3GAM · You're offline</title>
  <style>
    :root{color-scheme:light;--bg:#EEF1E4;--card:#fff;--olive:#2F4A1E;--lime:#D4F28A;--text:#18240F;--muted:#59644e}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,#DCE8C7,transparent 52%),var(--bg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    main{width:min(100%,420px);padding:32px 26px;text-align:center;background:linear-gradient(160deg,#fff,#FCFDF8 60%,#F4F7EA);border:1px solid #5E8B2F35;border-radius:28px;box-shadow:0 22px 60px #2F4A1E16}
    .mark{width:66px;height:66px;display:grid;place-items:center;margin:0 auto 22px;border-radius:21px;background:linear-gradient(145deg,#7BA33F,#5E8B2F 45%,#2F4A1E);color:var(--lime);font-size:24px;font-weight:900;letter-spacing:-1px}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#5E8B2F;text-transform:uppercase}h1{font-size:29px;line-height:1.12;letter-spacing:-.8px;margin:10px 0 12px}p{margin:0 0 22px;color:var(--muted);font-size:14px}
    button{min-height:48px;width:100%;border:0;border-radius:14px;background:var(--olive);color:white;font-weight:800;font-size:14px;cursor:pointer}small{display:block;margin-top:16px;color:#6F7568;font-size:11px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">V3</div>
    <div class="eyebrow">V3GAM · AI TASK SCHEDULER</div>
    <h1>You're offline</h1>
    <p>Reconnect to the internet to sign in, sync your tasks, and continue planning your day. Your private task data is not stored by this offline page.</p>
    <button id="offline-retry" type="button">Try again</button>
    <small>Your website is still here when your connection returns.</small>
  </main>
  <script src="/v3gam-offline.js" defer></script>
</body>
</html>
