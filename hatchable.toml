name = "Orbit AI Task Scheduler"
tagline = "Your AI-powered daily planner"
description = "Voice-first task scheduling, habits, and personal productivity."
category = "Productivity"
tags = ["ai", "tasks", "habits", "scheduler"]

# Supabase Auth owns end-user login and sessions; Hatchable native auth is intentionally unused.

[ai]
required = true
providers = ["google", "openai", "anthropic"]

[[secret]]
name = "SUPABASE_URL"
required = true
description = "URL of the Supabase project used for Orbit email/password authentication."

[[secret]]
name = "SUPABASE_ANON_KEY"
required = true
description = "Supabase publishable/anon key. Never use a service_role key here."