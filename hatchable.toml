name = "Orbit AI Task Scheduler"
tagline = "Your AI-powered daily planner"
description = "Voice-first task scheduling, habits, and personal productivity."
category = "Productivity"
tags = ["ai", "tasks", "habits", "scheduler"]

[auth]
enabled = true
providers = ["email", "google"]
signup = "open"

[ai]
required = true
providers = ["google", "openai", "anthropic"]

[db.tables.orbit_tasks]
read = "own"
write = "own"

[db.tables.orbit_habits]
read = "own"
write = "own"

[db.tables.orbit_habit_logs]
read = "own"
write = "own"

[db.tables.orbit_preferences]
read = "own"
write = "own"

[db.tables.orbit_notifications]
read = "own"
write = "own"